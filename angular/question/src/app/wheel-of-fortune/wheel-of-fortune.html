<app-menu></app-menu>

<h1>Wheel of Fortune!</h1>

<button (click)="getRandomPerson()">
    Pick random person
</button>

<button type="button" (click)="startSpinning()">
  Start
</button>

<button type="button" (click)="stopSpinning()">
  Stop
</button>

<p>Total selections: {{ totalSelections }}</p>

@if (selectedName) {
    <p>
        Selected person: {{ selectedName }}
    </p>
} @else {
    <p>
        No person selected yet.
    </p> 
    
}
<ul>
    @for (person of persons.getAll(); track person.id) {
        <li>
            {{ person.id }} - {{ person.name }} - {{ person.selectedCount }}            
        </li>
    }
</ul>
