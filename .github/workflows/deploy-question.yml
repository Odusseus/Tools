name: Deploy question to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'angular/question/**'
      - '.github/workflows/deploy-question.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular/question
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: angular/question/package-lock.json

      - run: npm ci

      - run: npx ng build --configuration production --base-href /Tools/

      # SPA-fallback: directe links zoals /Tools/persons laten Angular routeren
      - run: cp dist/question/browser/index.html dist/question/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: angular/question/dist/question/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
